# SWIT QB Companion: signs and publishes the update notice for a release.
#  - A release published here (tag v2.0.0-beta.42, the zip attached, the notes in its description):
#    beta.json always; stable.json too when the release is not marked "pre-release".
#  - Run by hand (Actions -> Publish update -> Run workflow) to make an earlier release the stable one.
name: Publish update
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 2.0.0-beta.42)'
        required: true
      channel:
        description: 'stable or beta'
        required: true
        default: stable
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # a release run would check out its tag (no branch to push to)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # the version is taken from the tag, ignoring anything around it (a "v", a stray bracket or space):
          # "v2.0.0-beta.58)" -> 2.0.0-beta.58; the release is still found by its own tag
          clean() { printf '%s' "$1" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z]+\.[0-9]+)?' | head -n1 || true; }
          if [ "${{ github.event_name }}" = "release" ]; then
            RAW="${{ github.event.release.tag_name }}"
            VER="$(clean "$RAW")"; TAG="$RAW"
            if [ "${{ github.event.release.prerelease }}" = "true" ]; then CHANNELS="beta"; else CHANNELS="beta stable"; fi
          else
            VER="$(clean "${{ inputs.version }}")"; CHANNELS="${{ inputs.channel }}"
            # the release's tag: v2.0.0-beta.N as agreed, 2.0.0-beta.N without the v, or any tag with that version in it
            TAG="v${VER}"
            if ! gh release view "$TAG" > /dev/null 2>&1; then TAG="${VER}"; fi
            if ! gh release view "$TAG" > /dev/null 2>&1; then
              TAG="$(gh api "repos/${{ github.repository }}/releases?per_page=50" --jq ".[].tag_name" | grep -F -- "$VER" | head -n1 || true)"
            fi
          fi
          if [ -z "$VER" ]; then echo "::error::No version (like 2.0.0-beta.58) was found in '${RAW:-${{ inputs.version }}}'."; exit 1; fi
          if [ -z "$TAG" ]; then echo "::error::No release was found for ${VER}."; exit 1; fi
          if [ "$TAG" != "v${VER}" ]; then echo "::warning::The release's tag is '${TAG}' (expected v${VER}): it was used as it is. Next time name the tag v${VER}."; fi
          ZIP="SWITQBCompanion_WindowsApp_${VER}.zip"
          echo "Release tag: ${TAG}"
          if ! gh release download "$TAG" --pattern "$ZIP" --dir . --clobber; then
            echo "::error::The release ${TAG} has no file named ${ZIP}. Attach the zip (name unchanged) with Edit release, then run this workflow by hand: Actions -> Publish update -> Run workflow (version ${VER}, channel beta or stable)."
            exit 1
          fi
          gh release view "$TAG" --json body --jq .body > notes.md
          echo "VER=$VER" >> "$GITHUB_ENV"; echo "TAG=$TAG" >> "$GITHUB_ENV"; echo "ZIP=$ZIP" >> "$GITHUB_ENV"; echo "CHANNELS=$CHANNELS" >> "$GITHUB_ENV"
      - name: Sign the notice
        env:
          UPDATE_KEY: ${{ secrets.UPDATE_KEY }}
        run: |
          set -euo pipefail
          URL="https://github.com/${{ github.repository }}/releases/download/$(printf '%s' "$TAG" | jq -sRr @uri)/${ZIP}"
          for CH in $CHANNELS; do node scripts/sign-notice.js "$ZIP" "$VER" "$CH" "$URL" notes.md > "channels/${CH}.json"; done
          rm -f "$ZIP" notes.md
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name "SWIT release bot"; git config user.email "releases@users.noreply.github.com"
          git add channels/*.json
          git commit -m "Update notice: ${VER} (${CHANNELS})" || echo "nothing changed"
          git pull --rebase origin main || true
          git push origin HEAD:main
